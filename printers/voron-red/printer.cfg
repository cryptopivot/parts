[include ./KlickyProbe/klicky-probe.cfg]
[include nitehawk-sbv2.cfg]
[include mainsail.cfg]
#[include adxl345-v2.0.cfg]
[include Knomi2.cfg]
[include nozzle_scrub-2.cfg]
[include timelapse.cfg]
[include LED-Macros-Main.cfg]
#[include Cold_Pull.cfg]
#[include led-test.cfg]





[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_06001A000D51313339373836-if00

[mcu nhk]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3C001D000251353032333039-if00

##--------------------------------------------------------------------
[exclude_object]

#####################################################################
#   MCU Temps
#####################################################################

#[temperature_sensor Octopus_Pro_MCU]
#sensor_type: temperature_mcu
#min_temp: 0
#max_temp: 100

#[temperature_sensor Raspberry_Pi_5]
#sensor_type: temperature_host
#min_temp: 10
#max_temp: 100

##################################################################
#   X/Y Printer Settings
##################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 4000
max_z_velocity: 25
max_z_accel: 400
square_corner_velocity: 5.0


##################################################################
#   X/Y Stepper Settings
##################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400  
endstop_pin: ^PG6 
position_min: 0
##--------------------------------------------------------------------

position_endstop: 300
position_max: 300


##--------------------------------------------------------------------
homing_speed: 100   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 0.85
sense_resistor: 0.110
stealthchop_threshold: 0
#stealthchop_threshold: 999999

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper
endstop_pin: ^PG9 
position_min: 0
##--------------------------------------------------------------------
position_endstop: 300
position_max: 300
##--------------------------------------------------------------------
homing_speed: 80  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 0.85
sense_resistor: 0.110
stealthchop_threshold: 0
#stealthchop_threshold: 999999
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
#endstop_pin: ^PG10   Trying our disable endstop pin
endstop_pin: probe:z_virtual_endstop

##--------------------------------------------------------------------
position_max: 260
##--------------------------------------------------------------------
position_min: -5
homing_speed: 7
second_homing_speed: 3
homing_retract_dist: 2

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0
#stealthchop_threshold: 999999

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0
#stealthchop_threshold: 999999

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0
#stealthchop_threshold: 999999

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0
#stealthchop_threshold: 999999

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA3
sensor_pin: PF3
sensor_type: Generic 3950
max_power: 0.85
min_temp: 0
max_temp: 120


######################################################################
# Fan Control
#####################################################################
[temperature_fan MCU_Bay_fan]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
sensor_type: temperature_mcu
control: pid
pid_Kp: 1.0
pid_Ki: 0.5
pid_Kd: 0.0
min_temp: 0
max_temp: 100
target_temp: 40
max_speed: 1.0
min_speed: 0.0
off_below: 0.15         # Sets a safe 15% electrical floor for the fan

[temperature_fan Pi5_Bay_fan]
pin: PD12
max_power: 1.0
shutdown_speed: 0.0
sensor_type: temperature_host
#control: pid
control: watermark
#pid_Kp: 1.0
#pid_Ki: 0.5
#pid_Kd: 0.0
max_delta: 2.0
kick_start_time: 0.3
min_temp: 0
max_temp: 100
target_temp: 38
max_speed: 1.0
min_speed: 0.0
off_below: 0.22


##  Exhaust fan - FAN4
[fan_generic exhaust_fan]
pin: PD14
max_power: 1.0
#shutdown_speed: 0.1
kick_start_time: 0.5

[delayed_gcode DISABLE_EXHAUST]
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0.0
